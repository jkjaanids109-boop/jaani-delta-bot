name: Jaani 24x7 Trading Bot

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  run-bot:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: pip install requests pandas numpy mplfinance pytz six pillow imageio imageio-ffmpeg edge-tts gTTS

      - name: Run BTC Trading Bot
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python bot.py

      - name: Save Bot Memory
        run: |
          git config --global user.name "JaaniBot"
          git config --global user.email "bot@github.com"
          git add bot_state.json || true
          git diff --staged --quiet || git commit -m "Update bot state"
          git push || true
